name: Divan Project Contract
description: Build and run the portable, read-only Divan Project Contract verifier
inputs:
  project:
    description: Project path relative to the checked-out workspace
    required: false
    default: .
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: '3.12'
    - name: Verify project contract
      shell: bash
      env:
        DIVAN_PROJECT_INPUT: ${{ inputs.project }}
      run: python "$GITHUB_ACTION_PATH/../../../plugins/sadrazam/divan_runtime/cli.py" verify --project "$DIVAN_PROJECT_INPUT" --json
