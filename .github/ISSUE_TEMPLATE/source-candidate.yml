name: Kaynak adayı
description: İncelenmesi için dış skill, eklenti, framework veya standart önerin
title: "[Kaynak adayı]: "
labels: [source-candidate]
body:
  - type: markdown
    attributes:
      value: Bu form yalnız aday üretir. Dış kod otomatik kurulmaz veya çalıştırılmaz.
  - type: input
    id: url
    attributes:
      label: Kanonik GitHub repo adresi
      placeholder: https://github.com/owner/repo
    validations: {required: true}
  - type: input
    id: pin
    attributes:
      label: İncelenen commit
      placeholder: 40 haneli commit SHA
    validations: {required: true}
  - type: input
    id: license
    attributes:
      label: Lisans kanıtı
      description: SPDX adı ve aynı commit'e bağlı dosya adresi; bilmiyorsanız UNKNOWN.
    validations: {required: true}
  - type: textarea
    id: gap
    attributes:
      label: Kapatılan kullanıcı boşluğu
    validations: {required: true}
  - type: textarea
    id: permissions
    attributes:
      label: Script, hook, ağ, secret ve dosya yetkileri
    validations: {required: true}
  - type: checkboxes
    id: consent
    attributes:
      label: Kabul
      options:
        - label: Bu kayıt otomatik kurulum veya benimseme kararı değildir.
          required: true
