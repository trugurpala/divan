name: Hata bildirimi
description: Tekrar üretilebilir bir Divan hatasını bildirin
title: "[Hata]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Güvenlik açığını burada paylaşmayın; özel güvenlik bildirimi kullanın. Kişisel ve gizli veriyi çıkarın.
  - type: input
    id: version
    attributes:
      label: Divan sürümü
      placeholder: Örnek: vX.Y.Z
    validations: {required: true}
  - type: input
    id: environment
    attributes:
      label: İşletim sistemi ve host
      placeholder: Windows 11, Codex 0.x
    validations: {required: true}
  - type: textarea
    id: reproduction
    attributes:
      label: En küçük tekrar üretim
      description: Beklenen ve gerçekleşen sonucu, redakte edilmiş doctor çıktısıyla birlikte yazın.
    validations: {required: true}
  - type: textarea
    id: evidence
    attributes:
      label: Kanıt
      description: Test özeti, hata kodu veya güvenli ekran görüntüsü.
    validations: {required: true}
  - type: checkboxes
    id: privacy
    attributes:
      label: Gizlilik
      options:
        - label: İçerik token, e-posta, mutlak yol, müşteri verisi veya özel depo bilgisi içermiyor.
          required: true
