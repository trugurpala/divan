name: Özellik önerisi
description: Çözülmemiş bir kullanıcı ihtiyacını anlatın
title: "[Özellik]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Kullanıcı sorunu
      description: Bugün yapılamayan veya gereksiz zor olan somut işi anlatın.
    validations: {required: true}
  - type: textarea
    id: outcome
    attributes:
      label: Beklenen sonuç
      description: Çözümün kullanıcı tarafından nasıl doğrulanacağını yazın.
    validations: {required: true}
  - type: textarea
    id: alternatives
    attributes:
      label: Denenen yollar
    validations: {required: false}
  - type: checkboxes
    id: scope
    attributes:
      label: Kapsam
      options:
        - label: Öneri Divan'ın tek repo ve modüler paket yapısını koruyor.
          required: true
