name: Doğrulanmış temiz-proje kanıtı
description: Sabitlenmiş bir Divan release'iyle üretilen schema-2 teknik kanıtı gönderin
title: "[Temiz-proje kanıtı]: "
labels: ["adoption-evidence"]
body:
  - type: markdown
    attributes:
      value: |
        Bu form kişinin kim olduğunu değil, gerçek ve Divan'dan ayrı bir projede çalışan makinece doğrulanmış kanıtı ölçer. Bakımcı ve dış kullanıcı aynı teknik kapıya tabidir. Önce gerçek uygulama/test dosyalarını `goal advance --to verified --evidence ... --execute` ile hedefe bağlayın. Yalnız `adoption prove --execute` tarafından üretilen, çevrimdışı doğrulamada `valid-clean-room-adoption` sonucu veren schema-2 makbuzu gönderin. Bu kanıt pazar benimsemesi, üçüncü taraf onayı, hız veya kalite artışı iddiası değildir.
  - type: input
    id: release
    attributes:
      label: Değişmez Divan release/tag
      placeholder: v0.18.3
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Kanıtlanan host
      options: [Claude Code, Codex]
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Kaba ortam bilgisi
      description: Kullanıcı adı veya mutlak yol yazmadan işletim sistemi ve gözlenen host sürümünü belirtin.
      placeholder: Windows 11, Codex x.y.z
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Gerçek görev
      description: Temiz projede tamamlanan gerçek işi kısa ve kişisel veri içermeden anlatın.
    validations:
      required: true
  - type: textarea
    id: receipt
    attributes:
      label: Redakte edilmiş schema-2 makbuzu
      description: "`adoption-receipt.json` gövdesini ekleyin. Ham komut çıktısı, mutlak yol, remote URL, e-posta, token veya müşteri verisi eklemeyin."
      render: json
    validations:
      required: true
  - type: input
    id: verification
    attributes:
      label: Çevrimdışı doğrulama sonucu
      placeholder: valid-clean-room-adoption
    validations:
      required: true
  - type: textarea
    id: rollback
    attributes:
      label: Kaldırma/geri alma sonucu
      description: Denediyseniz özeti; denemediyseniz nedenini yazın.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Gizlilik ve kapsam
      options:
        - label: Paylaşımım gizli bilgi, kişisel veri, mutlak yol, remote URL, token veya API anahtarı içermiyor.
          required: true
        - label: Bu kaydı yalnız makinece doğrulanmış temiz-proje kanıtı olarak sunuyorum; bağımsız kullanıcı sayısı, üçüncü taraf onayı veya verim artışı iddia etmiyorum.
          required: true
