name: pusula-dagger

on:
  push:
    paths:
      - 'incubator/pusula/pipeline-python/**'
      - 'incubator/pusula/backend/**'
      - 'incubator/pusula/web/**'
      - 'scripts/pusula_app_verify.py'
      - '.github/workflows/pusula-dagger.yml'
  pull_request:
    paths:
      - 'incubator/pusula/pipeline-python/**'
      - 'incubator/pusula/backend/**'
      - 'incubator/pusula/web/**'
      - 'scripts/pusula_app_verify.py'
      - '.github/workflows/pusula-dagger.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install exact Dagger stable CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dagger-bin"
          curl -fsSL https://dl.dagger.io/dagger/install.sh \
            | DAGGER_VERSION=0.21.8 BIN_DIR="$RUNNER_TEMP/dagger-bin" sh
          echo "$RUNNER_TEMP/dagger-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/dagger-bin/dagger" version

      - name: Run canonical Pusula pipeline
        shell: bash
        env:
          DAGGER_NO_NAG: '1'
        run: |
          set -euo pipefail
          dagger -y -m incubator/pusula/pipeline-python call check --source=.
