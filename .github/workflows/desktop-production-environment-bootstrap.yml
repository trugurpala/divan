name: Desktop Production Environment Bootstrap

on:
  workflow_dispatch:
    inputs:
      reviewer_type:
        description: "Required reviewer kind for production-release"
        required: true
        default: User
        type: choice
        options:
          - User
          - Team
      reviewer_id:
        description: "Numeric GitHub user/team ID allowed to approve production-release"
        required: true
        type: string

permissions: read-all

jobs:
  bootstrap-production-release:
    name: bootstrap-production-release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-release
    permissions:
      contents: read
    steps:
      - name: Validate bootstrap inputs and independent reviewer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWER_TYPE: ${{ inputs.reviewer_type }}
          REVIEWER_ID: ${{ inputs.reviewer_id }}
        run: |
          set -euo pipefail
          if [[ "$REVIEWER_TYPE" != "User" && "$REVIEWER_TYPE" != "Team" ]]; then
            echo "reviewer_type must be User or Team" >&2
            exit 1
          fi
          if [[ ! "$REVIEWER_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "reviewer_id must be a positive numeric GitHub user/team ID" >&2
            exit 1
          fi
          if [[ "$REVIEWER_TYPE" == "User" ]]; then
            actor_id="$(gh api "users/$GITHUB_ACTOR" --jq '.id')"
            if [[ "$actor_id" == "$REVIEWER_ID" ]]; then
              echo "production-release reviewer must be independent from the bootstrap initiator" >&2
              exit 1
            fi
          fi

      - name: Verify bootstrap still targets current main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          event_sha="${GITHUB_SHA,,}"
          if [[ ! "$event_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "bootstrap workflow event SHA is not an exact Git commit" >&2
            exit 1
          fi
          live_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha' | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$live_main" =~ ^[0-9a-f]{40}$ ]]; then
            echo "current main source SHA could not be resolved" >&2
            exit 1
          fi
          if [[ "$event_sha" != "$live_main" ]]; then
            echo "main moved after production-release bootstrap dispatch; restart on current main" >&2
            exit 1
          fi

      - name: Verify production-release migration gate exists before admin mutation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          environment_json="$(gh api "repos/$GITHUB_REPOSITORY/environments/production-release")"
          environment_name="$(jq -r '.name // empty' <<<"$environment_json")"
          required_rule_count="$(jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length' <<<"$environment_json")"
          reviewer_count="$(jq '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length' <<<"$environment_json")"
          custom_branch_policies="$(jq -r '.deployment_branch_policy.custom_branch_policies // false' <<<"$environment_json")"
          if [[ "$environment_name" != "production-release" ]]; then
            echo "production-release environment must already exist before bootstrap" >&2
            exit 1
          fi
          if [[ "$required_rule_count" -ne 1 || "$reviewer_count" -ne 1 ]]; then
            echo "production-release bootstrap requires an existing single-reviewer migration gate" >&2
            exit 1
          fi
          if [[ "$custom_branch_policies" != "true" ]]; then
            echo "production-release bootstrap requires custom deployment branch policies before admin mutation" >&2
            exit 1
          fi

          branch_policies="$(gh api "repos/$GITHUB_REPOSITORY/environments/production-release/deployment-branch-policies")"
          total_policy_count="$(jq '.branch_policies | length' <<<"$branch_policies")"
          main_policy_count="$(jq '[.branch_policies[]? | select(.name == "main")] | length' <<<"$branch_policies")"
          if [[ "$total_policy_count" -ne 1 || "$main_policy_count" -ne 1 ]]; then
            echo "production-release bootstrap requires the existing migration gate to allow only main" >&2
            exit 1
          fi

      - name: Reconcile protected production-release environment
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DIVAN_RELEASE_ADMIN_TOKEN }}
          REVIEWER_TYPE: ${{ inputs.reviewer_type }}
          REVIEWER_ID: ${{ inputs.reviewer_id }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "production-release/DIVAN_RELEASE_ADMIN_TOKEN is required" >&2
            exit 1
          fi

          payload="$(jq -n \
            --arg reviewer_type "$REVIEWER_TYPE" \
            --argjson reviewer_id "$REVIEWER_ID" \
            '{
              wait_timer: 0,
              prevent_self_review: true,
              reviewers: [{type: $reviewer_type, id: $reviewer_id}],
              deployment_branch_policy: {
                protected_branches: false,
                custom_branch_policies: true
              }
            }')"

          gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/environments/production-release" \
            --input - <<<"$payload" >/dev/null

          policies="$(gh api "repos/$GITHUB_REPOSITORY/environments/production-release/deployment-branch-policies")"
          while IFS=$'\t' read -r policy_id policy_name; do
            if [[ -n "$policy_id" && "$policy_name" != "main" ]]; then
              gh api \
                --method DELETE \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "repos/$GITHUB_REPOSITORY/environments/production-release/deployment-branch-policies/$policy_id" >/dev/null
            fi
          done < <(jq -r '.branch_policies[]? | [.id, .name] | @tsv' <<<"$policies")

          policies="$(gh api "repos/$GITHUB_REPOSITORY/environments/production-release/deployment-branch-policies")"
          main_policy_count="$(jq '[.branch_policies[]? | select(.name == "main")] | length' <<<"$policies")"
          if [[ "$main_policy_count" -eq 0 ]]; then
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/$GITHUB_REPOSITORY/environments/production-release/deployment-branch-policies" \
              -f name=main >/dev/null
          fi

          environment_json="$(gh api "repos/$GITHUB_REPOSITORY/environments/production-release")"
          required_rule_count="$(jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length' <<<"$environment_json")"
          reviewer_count="$(jq '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length' <<<"$environment_json")"
          reviewer_match="$(jq \
            --arg reviewer_type "$REVIEWER_TYPE" \
            --argjson reviewer_id "$REVIEWER_ID" \
            '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]? | select(.type == $reviewer_type and .reviewer.id == $reviewer_id)] | length' \
            <<<"$environment_json")"
          prevent_self_review_actual="$(jq -r '[.protection_rules[]? | select(.type == "required_reviewers")][0].prevent_self_review // false' <<<"$environment_json")"
          protected_branches="$(jq -r '.deployment_branch_policy.protected_branches // false' <<<"$environment_json")"
          custom_branch_policies="$(jq -r '.deployment_branch_policy.custom_branch_policies // false' <<<"$environment_json")"
          can_admins_bypass="$(jq -r '.can_admins_bypass // true' <<<"$environment_json")"
          if [[ "$required_rule_count" -ne 1 || "$reviewer_count" -ne 1 || "$reviewer_match" -ne 1 ]]; then
            echo "production-release must have exactly the requested required reviewer and no alternate approval authority" >&2
            exit 1
          fi
          if [[ "$prevent_self_review_actual" != "true" ]]; then
            echo "production-release must prevent workflow initiators from approving their own release deployment" >&2
            exit 1
          fi
          if [[ "$protected_branches" != "false" || "$custom_branch_policies" != "true" ]]; then
            echo "production-release must use only custom deployment branch policies" >&2
            exit 1
          fi

          branch_policies="$(gh api "repos/$GITHUB_REPOSITORY/environments/production-release/deployment-branch-policies")"
          total_policy_count="$(jq '.branch_policies | length' <<<"$branch_policies")"
          main_policy_count="$(jq '[.branch_policies[]? | select(.name == "main")] | length' <<<"$branch_policies")"
          if [[ "$total_policy_count" -ne 1 || "$main_policy_count" -ne 1 ]]; then
            echo "production-release must allow only the main branch policy" >&2
            exit 1
          fi
          if [[ "$can_admins_bypass" != "false" ]]; then
            echo "production-release still allows administrator bypass; disable 'Allow administrators to bypass configured protection rules' in repository environment settings, then rerun this bootstrap" >&2
            exit 1
          fi

          echo "production-release has exact independent reviewer authority, self-review prevention, no admin bypass, and main-only deployment policy"
