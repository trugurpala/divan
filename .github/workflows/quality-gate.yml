name: quality-gate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Install quality dependencies
        run: pip install -r requirements-dev.txt

      - name: Naming contract
        run: python scripts/naming.py --check

      - name: Divan architecture validation
        shell: bash
        run: |
          set +e
          output="$(python scripts/divan.py validate 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              [ -z "$line" ] || printf '::error title=Divan architecture validation::%s\n' "$line"
            done <<< "$output"
            exit "$status"
          fi

      - name: Prose contract
        run: python scripts/prose.py --check

      - name: Community standards
        run: python scripts/standards.py --check

      - name: Wiki sync contract
        run: python scripts/wiki.py --check

      - name: Candidate review contract
        run: python scripts/candidate_review.py --check

      - name: Build deterministic project runners
        shell: bash
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/python-cache
        run: |
          python scripts/build_project_runner.py --output "$RUNNER_TEMP/divan-project-a.pyz" --source-commit "${{ github.sha }}"
          python scripts/build_project_runner.py --output "$RUNNER_TEMP/divan-project-b.pyz" --source-commit "${{ github.sha }}"
          cmp "$RUNNER_TEMP/divan-project-a.pyz" "$RUNNER_TEMP/divan-project-b.pyz"

      - name: Validate project runner bundle
        run: python "$RUNNER_TEMP/divan-project-a.pyz" validate --json

      - name: Ruff
        env:
          RUFF_CACHE_DIR: ${{ runner.temp }}/ruff-cache
        run: ruff check .

      - name: Clean-code gate
        run: python scripts/clean_code.py --check

      - name: Mypy
        env:
          MYPY_CACHE_DIR: ${{ runner.temp }}/mypy-cache
        run: mypy scripts evals plugins/sadrazam/divan_runtime plugins/sadrazam/company

      - name: Actionlint
        shell: bash
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.10
          "$(go env GOPATH)/bin/actionlint"

      - name: Canonical verification with coverage
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/python-cache
          RUFF_CACHE_DIR: ${{ runner.temp }}/ruff-cache
          MYPY_CACHE_DIR: ${{ runner.temp }}/mypy-cache
          COVERAGE_FILE: ${{ runner.temp }}/coverage
        run: python scripts/verify.py --coverage

      - name: Agent Skills resmi dogrulayici
        run: |
          pip install skills-ref==0.1.1
          for skill in plugins/*/skills/*; do agentskills validate "$skill"; done

      - name: Claude Code resmi dogrulayici
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.212 plugin validate . --strict
          for plugin in plugins/*; do npx --yes @anthropic-ai/claude-code@2.1.212 plugin validate "$plugin" --strict; done
