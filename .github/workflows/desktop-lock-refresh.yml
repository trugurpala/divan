name: Desktop Cargo Lock Refresh

on:
  push:
    branches:
      - feat/orca-engine-v1.4
    paths:
      - ".github/workflows/desktop-lock-refresh.yml"
      - "apps/desktop/src-tauri/Cargo.toml"

permissions:
  contents: write

jobs:
  cargo-lock-refresh:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/orca-engine-v1.4
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v1

      - name: Generate Cargo lockfile with Cargo
        working-directory: apps/desktop
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml

      - name: Commit Cargo-generated lockfile
        shell: pwsh
        run: |
          git diff --exit-code -- apps/desktop/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "Cargo lock refresh modified Cargo.toml unexpectedly" }
          git diff --quiet -- apps/desktop/src-tauri/Cargo.lock
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Cargo.lock is already current"
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri/Cargo.lock
          git commit -m "build(desktop): refresh Cargo lock with Cargo"
          if ($LASTEXITCODE -ne 0) { throw "Could not commit Cargo-generated lockfile" }
          git push origin HEAD:feat/orca-engine-v1.4
          if ($LASTEXITCODE -ne 0) { throw "Could not push Cargo-generated lockfile" }

      - name: Upload Cargo-generated lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: divan-desktop-cargo-lock-refresh
          path: apps/desktop/src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 1
