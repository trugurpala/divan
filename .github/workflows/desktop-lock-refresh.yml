name: Desktop Cargo Lock Refresh

on:
  push:
    branches:
      - feat/orca-engine-v1.4
    paths:
      - ".github/workflows/desktop-lock-refresh.yml"
      - "apps/desktop/src-tauri/Cargo.toml"

permissions:
  contents: read

jobs:
  cargo-lock-refresh:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v1

      - name: Generate Cargo lockfile with Cargo
        working-directory: apps/desktop
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml

      - name: Upload Cargo-generated lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: divan-desktop-cargo-lock-refresh
          path: apps/desktop/src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 1
