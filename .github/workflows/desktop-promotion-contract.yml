name: Desktop Promotion Contract

on:
  pull_request:
    paths:
      - ".github/workflows/desktop-promote.yml"
      - ".github/workflows/desktop-promotion-contract.yml"
      - "scripts/desktop_promotion_guard.py"
      - "scripts/desktop_release_evidence.py"
      - "scripts/desktop_release_guard.py"
      - "scripts/desktop_update_feed.py"
      - "scripts/prepare_desktop_release_config.py"
      - "scripts/windows_desktop_updater_e2e.ps1"
      - "tests/test_desktop_promotion_guard.py"
      - "tests/test_desktop_promotion_workflow.py"
      - "tests/test_desktop_release_guard.py"
      - "tests/test_desktop_update_feed.py"
      - "tests/test_desktop_updater_e2e_contract.py"

permissions: read-all

jobs:
  contract:
    name: desktop-promotion-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Verify fail-closed promotion and release contracts
        run: >-
          python -m unittest
          tests.test_desktop_promotion_guard
          tests.test_desktop_promotion_workflow
          tests.test_desktop_release_guard
          tests.test_desktop_update_feed
          tests.test_desktop_updater_e2e_contract

      - name: Verify unsigned state cannot satisfy stable gate
        run: python scripts/desktop_release_guard.py

  updater-continuity-windows:
    name: promotion-signed-updater-continuity
    needs: contract
    runs-on: windows-latest
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v1

      - name: Install sidecar packager
        run: python -m pip install --disable-pip-version-check pyinstaller==6.21.0

      - name: Install frontend dependencies from lockfile
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Build updater continuity frontend context
        working-directory: apps/desktop
        run: pnpm build

      - name: Compile updater continuity feature from Cargo.lock
        working-directory: apps/desktop
        run: cargo check --manifest-path src-tauri/Cargo.toml --features updater-e2e --locked

      - name: Re-run signed updater upgrade and recovery matrix
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP "divan-desktop-promotion-updater-e2e.json"
          & scripts/windows_desktop_updater_e2e.ps1 -Output $evidence
          if ($LASTEXITCODE -ne 0) { throw "promotion updater continuity runtime e2e failed" }
          if (-not (Test-Path $evidence -PathType Leaf)) { throw "promotion updater continuity evidence was not produced" }

          $payload = Get-Content $evidence -Raw | ConvertFrom-Json
          $sourceCommit = (& git rev-parse HEAD).Trim()
          $sourceTree = (& git rev-parse 'HEAD^{tree}').Trim()
          if ($payload.status -ne "pass") { throw "promotion updater continuity evidence did not pass" }
          if ($payload.source_commit -ne $sourceCommit -or $payload.source_tree -ne $sourceTree) {
            throw "promotion updater continuity evidence is not bound to exact source identity"
          }
          foreach ($field in @("valid_signed_upgrade", "tampered_signature_rejected", "forward_signed_recovery", "downgrade_not_offered", "signatures_mandatory", "test_only_insecure_transport")) {
            if ($payload.$field -ne $true) { throw "promotion updater continuity missing required PASS: $field" }
          }
          if ($payload.production_transport_policy -ne "https-only") {
            throw "promotion updater continuity weakened the production HTTPS transport policy"
          }

      - name: Verify continuity run did not drift dependency locks
        shell: pwsh
        run: |
          git diff --exit-code -- apps/desktop/pnpm-lock.yaml apps/desktop/src-tauri/Cargo.lock
          if ($LASTEXITCODE -ne 0) { throw "promotion continuity drifted Desktop dependency lockfiles" }
