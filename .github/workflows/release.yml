name: release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - 'CHANGELOG.md'
      - 'release-manifest.json'
      - 'scripts/release.py'
      - 'scripts/release_guard.py'
      - 'scripts/release_tag.py'
      - 'scripts/sbom.py'
      - 'scripts/build_project_runner.py'
      - 'scripts/build_bootstrap.py'
      - 'plugins/sadrazam/company/**'
      - 'plugins/sadrazam/divan_runtime/**'
      - '.github/actions/divan-project/action.yml'
      - '.github/workflows/release.yml'

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  codex-clean-host:
    name: Release kapısı / Codex ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Bootstrap dosyasını temiz hostta doğrula
        shell: bash
        env:
          CODEX_SKILLS_DIR: ${{ runner.temp }}/bootstrap-codex-skills
          DIVAN_STATE_DIR: ${{ runner.temp }}/bootstrap-codex-state
        run: |
          python scripts/build_bootstrap.py --output "$RUNNER_TEMP/divan.pyz" \
            --source-commit "$(git rev-parse HEAD)"
          python "$RUNNER_TEMP/divan.pyz" doctor --host codex --json
          python "$RUNNER_TEMP/divan.pyz" install --host codex --profile auto --execute \
            > "$RUNNER_TEMP/bootstrap-install.txt"
          python -c "import pathlib; text=pathlib.Path(r'$RUNNER_TEMP/bootstrap-install.txt').read_text(encoding='utf-8'); assert '42/42 skills' in text and 'VERIFIED SKILL FALLBACK' in text"
          python -c "import pathlib,os; assert len(list(pathlib.Path(os.environ['CODEX_SKILLS_DIR']).glob('*/SKILL.md')))==42"
          python "$RUNNER_TEMP/divan.pyz" _fallback-remove
          python -c "import pathlib,os; assert len(list(pathlib.Path(os.environ['CODEX_SKILLS_DIR']).glob('*/SKILL.md')))==0"
      - name: Unix kur-keşfet-kaldır
        if: runner.os != 'Windows'
        env:
          DIVAN_SOURCE_DIR: ${{ github.workspace }}
          CODEX_SKILLS_DIR: ${{ runner.temp }}/codex-skills
          DIVAN_STATE_DIR: ${{ runner.temp }}/codex-state
        run: |
          bash scripts/install_codex.sh
          test "$(find "$CODEX_SKILLS_DIR" -type f -name SKILL.md | wc -l)" -eq 42
          bash scripts/uninstall_codex.sh
          test "$(find "$CODEX_SKILLS_DIR" -type f -name SKILL.md | wc -l)" -eq 0
      - name: Windows kur-keşfet-kaldır
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DIVAN_SOURCE_DIR: ${{ github.workspace }}
          CODEX_SKILLS_DIR: ${{ runner.temp }}\codex-skills
          DIVAN_STATE_DIR: ${{ runner.temp }}\codex-state
        run: |
          & ./scripts/install_codex.ps1
          if (@(Get-ChildItem $env:CODEX_SKILLS_DIR -Filter SKILL.md -Recurse).Count -ne 42) { throw "42 skill bulunamadi" }
          & ./scripts/uninstall_codex.ps1
          if (@(Get-ChildItem $env:CODEX_SKILLS_DIR -Filter SKILL.md -Recurse).Count -ne 0) { throw "Kaldirma tamamlanmadi" }

  release_build:
    name: Release varlıklarını salt okunur hazırla
    needs: codex-clean-host
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      artifact_id: ${{ steps.release_assets_upload.outputs.artifact-id }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      TZ: UTC
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Bütün yerel yayın kapıları
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/validate.py
          python scripts/release.py --check
          python scripts/v1.py --check
          python evals/run.py --check
          python scripts/wiki.py --check
          python scripts/candidate_review.py --check
          python scripts/catalog.py --check
      - name: Resmî şema doğrulayıcıları
        run: |
          pip install skills-ref==0.1.1
          for skill in plugins/*/skills/*; do agentskills validate "$skill"; done
          npx --yes @anthropic-ai/claude-code@2.1.212 plugin validate . --strict
          for plugin in plugins/*; do npx --yes @anthropic-ai/claude-code@2.1.212 plugin validate "$plugin" --strict; done
      - name: Pages ve Wiki aynı sürüme gelene kadar bekle
        run: |
          python - <<'PY'
          import pathlib, time, urllib.request

          version = pathlib.Path("VERSION").read_text().strip()
          surfaces = {
              "Pages": ("https://trugurpala.github.io/divan/", [f"v{version}", "Fermanını seç"]),
              "Wiki": ("https://raw.githubusercontent.com/wiki/trugurpala/divan/Home.md", [f"v{version}", "Fermanını seç"]),
          }
          pending = dict(surfaces)
          for _ in range(30):
              for name, (url, markers) in list(pending.items()):
                  try:
                      request = urllib.request.Request(url, headers={"Cache-Control": "no-cache"})
                      text = urllib.request.urlopen(request, timeout=15).read().decode("utf-8")
                      if all(marker in text for marker in markers):
                          print(f"{name} v{version} canlı.")
                          del pending[name]
                  except OSError:
                      pass
              if not pending:
                  break
              time.sleep(10)
          if pending:
              raise SystemExit("Canlı yayın yüzeyi zamanında güncellenmedi: " + ", ".join(pending))
          PY
      - name: Canlı Pages etkileşimini Chromium ile doğrula
        run: |
          pip install playwright==1.61.0
          playwright install chromium --with-deps
          DIVAN_SITE_URL=https://trugurpala.github.io/divan/ python tests/site_testi.py
      - name: Sürüm varlıklarını üret
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          tag="v${version}"
          assets_dir="$RUNNER_TEMP/release-assets"
          mkdir -p "$assets_dir"
          notes="$assets_dir/divan-release-notes.md"
          archive="$assets_dir/divan-${tag}.zip"
          checksum="$assets_dir/divan-${tag}.sha256"
          sbom="$assets_dir/divan-${tag}.spdx.json"
          runner="$assets_dir/divan-project.pyz"
          runner_checksum="$assets_dir/divan-project.pyz.sha256"
          bootstrap="$assets_dir/divan.pyz"
          bootstrap_checksum="$assets_dir/divan.pyz.sha256"
          source_commit="$GITHUB_SHA"
          source_root="$GITHUB_WORKSPACE"
          remote_tag_commit="$(python scripts/release_tag.py --remote origin --tag "$tag")"
          local_tag_commit="$(
            git rev-parse --verify --quiet "refs/tags/$tag^{commit}" 2>/dev/null || true
          )"
          if [[ -n "$remote_tag_commit" ]]; then
            if [[ -n "$local_tag_commit" && "$local_tag_commit" != "$remote_tag_commit" ]]; then
              echo "HATA: yerel $tag etiketi uzak etiketle eşleşmiyor." >&2
              exit 1
            fi
            if [[ "$remote_tag_commit" != "$GITHUB_SHA" ]]; then
              echo "HATA: $tag etiketi güncel main commit'iyle eşleşmiyor." >&2
              exit 1
            fi
          elif [[ -n "$local_tag_commit" ]]; then
            echo "HATA: yerel $tag etiketi uzak depoda bulunamadi." >&2
            exit 1
          fi
          python "$source_root/scripts/release.py" --notes "$notes"
          git archive --format=zip --prefix="divan-${tag}/" --output="$archive" "$source_commit"
          python "$source_root/scripts/build_project_runner.py" --root "$source_root" \
            --output "$runner" --source-commit "$source_commit"
          python "$source_root/scripts/build_bootstrap.py" --root "$source_root" \
            --output "$bootstrap" --source-commit "$source_commit"
          runner_sha256="$(sha256sum "$runner" | awk '{print $1}')"
          printf '%s  %s\n' "$runner_sha256" "$(basename "$runner")" > "$runner_checksum"
          runner_checksum_sha256="$(sha256sum "$runner_checksum" | awk '{print $1}')"
          bootstrap_sha256="$(sha256sum "$bootstrap" | awk '{print $1}')"
          printf '%s  %s\n' "$bootstrap_sha256" "$(basename "$bootstrap")" > "$bootstrap_checksum"
          bootstrap_checksum_sha256="$(sha256sum "$bootstrap_checksum" | awk '{print $1}')"
          python "$source_root/scripts/sbom.py" --root "$source_root" \
            --output "$sbom" --source-commit "$source_commit" \
            --artifact "$(basename "$runner")=$runner_sha256" \
            --artifact "$(basename "$runner_checksum")=$runner_checksum_sha256" \
            --artifact "$(basename "$bootstrap")=$bootstrap_sha256" \
            --artifact "$(basename "$bootstrap_checksum")=$bootstrap_checksum_sha256"
          archive_sha256="$(sha256sum "$archive" | awk '{print $1}')"
          sbom_sha256="$(sha256sum "$sbom" | awk '{print $1}')"
          printf '%s  %s\n%s  %s\n%s  %s\n%s  %s\n%s  %s\n%s  %s\nsource_commit=%s\ntag=%s\n' "$archive_sha256" "$(basename "$archive")" "$sbom_sha256" "$(basename "$sbom")" "$runner_sha256" "$(basename "$runner")" "$runner_checksum_sha256" "$(basename "$runner_checksum")" "$bootstrap_sha256" "$(basename "$bootstrap")" "$bootstrap_checksum_sha256" "$(basename "$bootstrap_checksum")" "$source_commit" "$tag" > "$checksum"
          test "$(
            python scripts/release_guard.py bundle "$assets_dir" --tag "$tag"
          )" = "$source_commit"
      - name: Doğrulanmış varlık paketini aktar
        id: release_assets_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: divan-release-assets
          path: ${{ runner.temp }}/release-assets
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Doğrulanmış release varlıklarını yayımla
    needs: release_build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production-release
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      TZ: UTC
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: GitHub yayın politikasını admin-read kanıtıyla doğrula
        env:
          GH_TOKEN: ${{ secrets.DIVAN_RELEASE_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || {
            echo "HATA: production-release/DIVAN_RELEASE_ADMIN_TOKEN gerekli." >&2
            exit 1
          }
          tag="v$(cat VERSION)"
          immutable="$RUNNER_TEMP/immutable-releases.json"
          ruleset="$RUNNER_TEMP/stable-tag-ruleset.json"
          gh api "repos/$GITHUB_REPOSITORY/immutable-releases" > "$immutable"
          gh api "repos/$GITHUB_REPOSITORY/rulesets/20332879" > "$ruleset"
          unset GH_TOKEN
          python scripts/release_guard.py immutable "$immutable"
          python scripts/release_guard.py ruleset "$ruleset" --tag "$tag"
      - name: Salt okunur işin doğrulanmış varlıklarını indir
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.release_build.outputs.artifact_id }}
          path: ${{ runner.temp }}/release-assets
          digest-mismatch: error
      - name: Varlık kimliğini ve canlı Release durumunu doğrula
        id: release_assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          tag="v${version}"
          assets_dir="$RUNNER_TEMP/release-assets"
          archive="$assets_dir/divan-${tag}.zip"
          bootstrap="$assets_dir/divan.pyz"
          bootstrap_checksum="$assets_dir/divan.pyz.sha256"
          checksum="$assets_dir/divan-${tag}.sha256"
          notes="$assets_dir/divan-release-notes.md"
          runner="$assets_dir/divan-project.pyz"
          runner_checksum="$assets_dir/divan-project.pyz.sha256"
          sbom="$assets_dir/divan-${tag}.spdx.json"
          source_commit="$(
            python scripts/release_guard.py bundle "$assets_dir" --tag "$tag"
          )"
          releases="$RUNNER_TEMP/releases-before-$tag.json"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$releases"
          live_main_commit="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha'
          )"
          unset GH_TOKEN
          test "$live_main_commit" = "$GITHUB_SHA"
          test "$source_commit" = "$live_main_commit"
          release_state="$(
            python scripts/release_guard.py releases "$releases" --tag "$tag"
          )"
          remote_tag_commit="$(python scripts/release_tag.py --remote origin --tag "$tag")"
          local_tag_commit="$(
            git rev-parse --verify --quiet "refs/tags/$tag^{commit}" 2>/dev/null || true
          )"
          published_release=false
          if [[ -n "$remote_tag_commit" ]]; then
            if [[ -n "$local_tag_commit" && "$local_tag_commit" != "$remote_tag_commit" ]]; then
              echo "HATA: yerel $tag etiketi uzak etiketle eşleşmiyor." >&2
              exit 1
            fi
            if [[ "$remote_tag_commit" != "$live_main_commit" ]]; then
              echo "HATA: uzak $tag etiketi güncel main ile eşleşmiyor." >&2
              exit 1
            fi
            if [[ "$release_state" == published ]]; then
              published_release=true
            fi
          elif [[ -n "$local_tag_commit" ]]; then
            echo "HATA: yerel $tag etiketi uzak depoda bulunamadi." >&2
            exit 1
          elif [[ "$release_state" == published ]]; then
            echo "HATA: yayimlanmis $tag Release kaydinin uzak etiketi yok." >&2
            exit 1
          else
            test "$source_commit" = "$GITHUB_SHA"
          fi
          {
            echo "archive=$archive"
            echo "bootstrap=$bootstrap"
            echo "bootstrap_checksum=$bootstrap_checksum"
            echo "checksum=$checksum"
            echo "notes=$notes"
            echo "runner=$runner"
            echo "runner_checksum=$runner_checksum"
            echo "sbom=$sbom"
            echo "source_commit=$source_commit"
            echo "tag=$tag"
            echo "published_release=$published_release"
          } >> "$GITHUB_OUTPUT"
      - name: Attest every release asset before publication
        if: steps.release_assets.outputs.published_release != 'true'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            ${{ steps.release_assets.outputs.archive }}
            ${{ steps.release_assets.outputs.sbom }}
            ${{ steps.release_assets.outputs.runner }}
            ${{ steps.release_assets.outputs.runner_checksum }}
            ${{ steps.release_assets.outputs.bootstrap }}
            ${{ steps.release_assets.outputs.bootstrap_checksum }}
            ${{ steps.release_assets.outputs.checksum }}
      - name: GitHub yayın politikasını yayımdan hemen önce yeniden doğrula
        env:
          GH_TOKEN: ${{ secrets.DIVAN_RELEASE_ADMIN_TOKEN }}
          RELEASE_TAG: ${{ steps.release_assets.outputs.tag }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || {
            echo "HATA: production-release/DIVAN_RELEASE_ADMIN_TOKEN gerekli." >&2
            exit 1
          }
          immutable="$RUNNER_TEMP/immutable-releases-publish.json"
          ruleset="$RUNNER_TEMP/stable-tag-ruleset-publish.json"
          gh api "repos/$GITHUB_REPOSITORY/immutable-releases" > "$immutable"
          gh api "repos/$GITHUB_REPOSITORY/rulesets/20332879" > "$ruleset"
          unset GH_TOKEN
          python scripts/release_guard.py immutable "$immutable"
          python scripts/release_guard.py ruleset "$ruleset" --tag "$RELEASE_TAG"
      - name: Publish or verify immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARCHIVE: ${{ steps.release_assets.outputs.archive }}
          RELEASE_BOOTSTRAP: ${{ steps.release_assets.outputs.bootstrap }}
          RELEASE_BOOTSTRAP_CHECKSUM: ${{ steps.release_assets.outputs.bootstrap_checksum }}
          RELEASE_CHECKSUM: ${{ steps.release_assets.outputs.checksum }}
          RELEASE_NOTES: ${{ steps.release_assets.outputs.notes }}
          RELEASE_RUNNER: ${{ steps.release_assets.outputs.runner }}
          RELEASE_RUNNER_CHECKSUM: ${{ steps.release_assets.outputs.runner_checksum }}
          RELEASE_SBOM: ${{ steps.release_assets.outputs.sbom }}
          RELEASE_SOURCE_COMMIT: ${{ steps.release_assets.outputs.source_commit }}
          RELEASE_TAG: ${{ steps.release_assets.outputs.tag }}
        run: |
          set -euo pipefail
          archive="$RELEASE_ARCHIVE"
          bootstrap="$RELEASE_BOOTSTRAP"
          bootstrap_checksum="$RELEASE_BOOTSTRAP_CHECKSUM"
          checksum="$RELEASE_CHECKSUM"
          notes="$RELEASE_NOTES"
          runner="$RELEASE_RUNNER"
          runner_checksum="$RELEASE_RUNNER_CHECKSUM"
          sbom="$RELEASE_SBOM"
          source_commit="$RELEASE_SOURCE_COMMIT"
          tag="$RELEASE_TAG"
          live_main_commit="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha'
          )"
          test "$live_main_commit" = "$GITHUB_SHA"
          test "$source_commit" = "$live_main_commit"
          live_tag_commit="$(python scripts/release_tag.py --remote origin --tag "$tag")"
          if [[ -z "$live_tag_commit" ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              --field ref="refs/tags/$tag" \
              --field sha="$source_commit"
            live_tag_commit="$(python scripts/release_tag.py --remote origin --tag "$tag")"
          fi
          if [[ "$live_tag_commit" != "$live_main_commit" ]]; then
            echo "HATA: uzak $tag etiketi $live_tag_commit, güncel main $live_main_commit." >&2
            exit 1
          fi
          releases="$RUNNER_TEMP/releases-publish-$tag.json"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$releases"
          release_state="$(
            python scripts/release_guard.py releases "$releases" --tag "$tag"
          )"
          if [[ "$release_state" == published ]]; then
            existing="$RUNNER_TEMP/existing-$tag"
            mkdir -p "$existing"
            gh release download "$tag" --pattern "$(basename "$archive")" --dir "$existing"
            gh release download "$tag" --pattern "$(basename "$checksum")" --dir "$existing"
            gh release download "$tag" --pattern "$(basename "$sbom")" --dir "$existing"
            gh release download "$tag" --pattern "$(basename "$runner")" --dir "$existing"
            gh release download "$tag" --pattern "$(basename "$runner_checksum")" --dir "$existing"
            gh release download "$tag" --pattern "$(basename "$bootstrap")" --dir "$existing"
            gh release download "$tag" --pattern "$(basename "$bootstrap_checksum")" --dir "$existing"
            cmp --silent "$archive" "$existing/$(basename "$archive")"
            cmp --silent "$checksum" "$existing/$(basename "$checksum")"
            cmp --silent "$sbom" "$existing/$(basename "$sbom")"
            cmp --silent "$runner" "$existing/$(basename "$runner")"
            cmp --silent "$runner_checksum" "$existing/$(basename "$runner_checksum")"
            cmp --silent "$bootstrap" "$existing/$(basename "$bootstrap")"
            cmp --silent "$bootstrap_checksum" "$existing/$(basename "$bootstrap_checksum")"
            echo "$tag Release varliklari byte-byte dogrulandi; hicbir varlik degistirilmedi."
          else
            live_main_commit="$(
              gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha'
            )"
            live_tag_commit="$(python scripts/release_tag.py --remote origin --tag "$tag")"
            test "$live_main_commit" = "$GITHUB_SHA"
            test "$source_commit" = "$live_main_commit"
            test "$live_tag_commit" = "$live_main_commit"
            gh release create "$tag" "$archive" "$checksum" "$sbom" "$runner" "$runner_checksum" "$bootstrap" "$bootstrap_checksum" --verify-tag --title "Divan $tag" --notes-file "$notes"
            test "$(python scripts/release_tag.py --remote origin --tag "$tag")" = "$source_commit"
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$releases"
            test "$(
              python scripts/release_guard.py releases "$releases" --tag "$tag"
            )" = published
          fi
