name: pusula-go-lock-repair

on:
  pull_request:
    paths:
      - 'incubator/pusula/pipeline/go.mod'
      - 'incubator/pusula/pipeline/go.sum'
      - '.github/workflows/pusula-go-lock-repair.yml'

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: auto
      GOSUMDB: sum.golang.org
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Repair known corrupted checksum and regenerate lockfiles
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('incubator/pusula/pipeline/go.sum')
          text = path.read_text()
          bad = 'github.com/pmezard/go-difflib v1.0.0/go.mod h1:iKH77koFhYxTK1pcRnkFqTogsbg7gZNVY4sRDYZ/4='
          good = 'github.com/pmezard/go-difflib v1.0.0/go.mod h1:iKH77koFhYxTK1pcRnkKkqfTogsbg7gZNVY4sRDYZ/4='
          if bad not in text:
              raise SystemExit('expected corrupted checksum not found; refusing blind rewrite')
          path.write_text(text.replace(bad, good, 1))
          PY
          cd incubator/pusula/pipeline
          go version
          go mod tidy
          go mod verify
          grep -F 'google.golang.org/grpc v1.82.1' go.mod
          grep -F 'github.com/pmezard/go-difflib v1.0.0/go.mod h1:iKH77koFhYxTK1pcRnkKkqfTogsbg7gZNVY4sRDYZ/4=' go.sum
          sha256sum go.mod go.sum

      - name: Upload verified Go lockfiles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pusula-go-lockfiles
          path: |
            incubator/pusula/pipeline/go.mod
            incubator/pusula/pipeline/go.sum
          if-no-files-found: error
          retention-days: 1
