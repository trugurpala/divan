name: Desktop Updater Trace Canary

on:
  push:
    branches:
      - feat/orca-engine-v1.4
    paths:
      - ".github/workflows/desktop-updater-trace.yml"
      - "scripts/windows_desktop_updater_e2e.ps1"
      - "scripts/windows_desktop_updater_e2e_trace.ps1"
      - "apps/desktop/**"

permissions:
  contents: read

jobs:
  updater-trace:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v1

      - name: Install sidecar packager
        run: python -m pip install --disable-pip-version-check pyinstaller==6.21.0

      - name: Run traced signed updater matrix
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP "divan-desktop-updater-e2e.json"
          $trace = Join-Path $env:RUNNER_TEMP "divan-desktop-updater-e2e-trace.txt"
          "DIVAN_UPDATER_TRACE=$trace" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DIVAN_UPDATER_TRACE_EVIDENCE=$evidence" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & scripts/windows_desktop_updater_e2e_trace.ps1 -Output $evidence -Transcript $trace

      - name: Upload updater trace
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: divan-desktop-updater-trace
          path: |
            ${{ env.DIVAN_UPDATER_TRACE }}
            ${{ env.DIVAN_UPDATER_TRACE_EVIDENCE }}
          if-no-files-found: warn
          retention-days: 1
