name: upstream-watch
on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 1 * *'  # her ayin 1'i 05:00 UTC
permissions:
  issues: write
  contents: read
jobs:
  upstream-nobet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - id: nobet
        run: |
          set +e
          python scripts/upstream_watch.py --format markdown > rapor.md 2> rapor.err
          kod=$?
          set -e
          case "$kod" in
            0) echo "durum=yok" >> "$GITHUB_OUTPUT" ;;
            2) echo "durum=var" >> "$GITHUB_OUTPUT" ;;
            *) echo "durum=hata" >> "$GITHUB_OUTPUT" ;;
          esac
          cat rapor.md
          cat rapor.err
      - if: steps.nobet.outputs.durum != 'hata'
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('rapor.md', 'utf8');
            const title = 'Nöbet raporu: upstream bakım durumu';
            const listed = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'nobet',
              per_page: 100
            });
            const current = listed.data.find(issue => !issue.pull_request);
            const debt = '${{ steps.nobet.outputs.durum }}' === 'var';
            if (debt && current) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: current.number, title, body
              });
            } else if (debt) {
              const params = {
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['nobet']
              };
              await github.rest.issues.create(params);
            } else if (current) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: current.number, title, body, state: 'closed'
              });
            }
      - if: steps.nobet.outputs.durum == 'hata'
        run: |
          echo "Upstream denetimi calistirilamadi; rapor yukarida." >&2
          exit 1
