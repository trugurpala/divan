name: upstream-watch
on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 1 * *'  # her ayin 1'i 05:00 UTC
permissions:
  issues: write
  contents: read
jobs:
  upstream-nobet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - id: nobet
        run: |
          set +e
          python scripts/upstream_watch.py --format markdown > rapor.md 2> rapor.err
          kod=$?
          set -e
          case "$kod" in
            0) echo "durum=yok" >> "$GITHUB_OUTPUT" ;;
            2) echo "durum=var" >> "$GITHUB_OUTPUT" ;;
            *) echo "durum=hata" >> "$GITHUB_OUTPUT" ;;
          esac
          cat rapor.md
          cat rapor.err
      - if: steps.nobet.outputs.durum != 'hata'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const listed = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'nobet',
              per_page: 100
            });
            fs.writeFileSync('nobet-issues.json', JSON.stringify(listed.data));
      - if: steps.nobet.outputs.durum != 'hata'
        run: |
          debt=no
          if [ "${{ steps.nobet.outputs.durum }}" = "var" ]; then debt=yes; fi
          python scripts/upstream_issue_policy.py --issues nobet-issues.json --debt "$debt" > nobet-plan.json
          cat nobet-plan.json
      - if: steps.nobet.outputs.durum != 'hata'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('rapor.md', 'utf8');
            const plan = JSON.parse(fs.readFileSync('nobet-plan.json', 'utf8'));
            const title = 'Nöbet raporu: upstream bakım durumu';
            for (const action of plan.actions) {
              if (action.operation === 'create') {
                await github.rest.issues.create({
                  owner: context.repo.owner, repo: context.repo.repo,
                  title, body, labels: ['nobet']
                });
              } else if (action.operation === 'update') {
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: action.issue_number, title, body
                });
              } else {
                const duplicate = action.operation === 'close-duplicate';
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: action.issue_number,
                  title,
                  body: duplicate ? `${body}\n\n> Mükerrer Nöbet kaydı kapatıldı; kanonik kayıt #${plan.primary_issue}.` : body,
                  state: 'closed'
                });
              }
            }
      - if: steps.nobet.outputs.durum == 'hata'
        run: |
          echo "Upstream denetimi calistirilamadi; rapor yukarida." >&2
          exit 1
