name: Divan V2 Quality

on:
  pull_request:
    paths:
      - "plugins/divan/**"
      - ".agents/plugins/marketplace.json"
      - "scripts/divan_v2_validate.py"
      - "tests/test_divan_v2*.py"
      - "evals/divan-v2-routing.json"
      - ".github/workflows/divan-v2-quality.yml"
  push:
    branches:
      - "rewrite/codex-native"
    paths:
      - "plugins/divan/**"
      - ".agents/plugins/marketplace.json"
      - "scripts/divan_v2_validate.py"
      - "tests/test_divan_v2*.py"
      - "evals/divan-v2-routing.json"
      - ".github/workflows/divan-v2-quality.yml"

permissions:
  contents: read

concurrency:
  group: divan-v2-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate Divan plugin contract
        run: python scripts/divan_v2_validate.py
      - name: Run Divan V2 tests
        run: python -m unittest tests/test_divan_v2.py tests/test_divan_v2_evals.py -v
