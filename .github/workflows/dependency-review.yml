name: dependency-review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Windows dependency graph guard
        shell: bash
        run: |
          set -euo pipefail
          cargo tree --locked \
            --manifest-path apps/desktop/src-tauri/Cargo.toml \
            --target x86_64-pc-windows-msvc \
            > "$RUNNER_TEMP/divan-windows-deps.txt"
          if grep -Eq '(^|[[:space:]])glib v' "$RUNNER_TEMP/divan-windows-deps.txt"; then
            echo "::error title=Windows dependency graph::glib entered the Windows release graph"
            exit 1
          fi
      - name: Bagimlilik farkini denetle
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # GHSA-wrw7-89jp-8q8g affects glib >=0.15,<0.20. Divan Desktop ships
          # Windows only; the preceding target graph guard fails closed if glib
          # ever becomes reachable from the Windows release graph.
          allow-ghsas: GHSA-wrw7-89jp-8q8g
