name: Desktop Real-User Acceptance

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact current main commit SHA approved for this acceptance run"
        required: true
        type: string

permissions: read-all

jobs:
  acceptance-environment-policy:
    name: acceptance-environment-policy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Verify desktop-acceptance environment is pre-created and protected
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          environment_json="$(gh api "repos/$GITHUB_REPOSITORY/environments/desktop-acceptance")"
          environment_name="$(jq -r '.name // empty' <<<"$environment_json")"
          reviewer_count="$(jq '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length' <<<"$environment_json")"
          if [[ "$environment_name" != "desktop-acceptance" ]]; then
            echo "desktop-acceptance environment must exist before acceptance dispatch" >&2
            exit 1
          fi
          if [[ "$reviewer_count" -lt 1 ]]; then
            echo "desktop-acceptance environment must have at least one required reviewer" >&2
            exit 1
          fi

  real-user-windows-acceptance:
    name: real-user-windows-acceptance
    needs: acceptance-environment-policy
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, windows, x64, divan-desktop-acceptance]
    timeout-minutes: 60
    environment: desktop-acceptance
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      DIVAN_EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify requested acceptance source identity
        shell: pwsh
        env:
          DIVAN_GITHUB_TOKEN: ${{ github.token }}
        run: |
          $expected = "$env:DIVAN_EXPECTED_SOURCE_SHA".Trim().ToLowerInvariant()
          $actual = (& git rev-parse HEAD).Trim().ToLowerInvariant()
          $eventSha = "$env:GITHUB_SHA".Trim().ToLowerInvariant()
          if ($expected -notmatch '^[0-9a-f]{40}$') {
            throw "source_sha must be an exact 40-character Git commit SHA"
          }
          if ($actual -ne $eventSha) {
            throw "Acceptance checkout does not match the workflow event source SHA"
          }
          if ($expected -ne $actual) {
            throw "Requested acceptance source SHA does not match the workflow source commit"
          }

          $headers = @{
            Authorization = "Bearer $env:DIVAN_GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $ref = Invoke-RestMethod `
            -Headers $headers `
            -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/git/ref/heads/main"
          $liveMain = "$($ref.object.sha)".Trim().ToLowerInvariant()
          if ($liveMain -notmatch '^[0-9a-f]{40}$') {
            throw "Current main source SHA could not be resolved"
          }
          if ($expected -ne $liveMain) {
            throw "main moved after acceptance dispatch; restart acceptance on current main"
          }

      - name: Resolve acceptance evidence path
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP "divan-windows-acceptance.json"
          "DIVAN_ACCEPTANCE_EVIDENCE=$evidence" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v1

      - name: Verify authenticated Codex and Claude sessions before build
        run: python scripts/desktop_agent_preflight.py

      - name: Install sidecar packager
        run: python -m pip install --disable-pip-version-check pyinstaller==6.21.0

      - name: Install frontend dependencies from lockfile
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Verify Rust dependency lock before acceptance build
        working-directory: apps/desktop
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

      - name: Verify dependency lockfiles did not drift
        shell: pwsh
        run: |
          git diff --exit-code -- apps/desktop/pnpm-lock.yaml apps/desktop/src-tauri/Cargo.lock
          if ($LASTEXITCODE -ne 0) {
            throw "Desktop dependency lockfiles drifted before real-user acceptance"
          }

      - name: Build exact-source NSIS candidate
        working-directory: apps/desktop
        run: pnpm desktop:build

      - name: Install exact-source candidate
        shell: pwsh
        run: |
          $installer = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe" -File | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced" }
          $install = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "NSIS silent install failed with $($install.ExitCode)" }

      - name: Verify installed Desktop process restart
        shell: pwsh
        run: |
          $appExe = Join-Path $env:LOCALAPPDATA "Divan/Divan.exe"
          if (-not (Test-Path $appExe)) {
            $candidate = Get-ChildItem $env:LOCALAPPDATA -Filter "Divan.exe" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($candidate) { $appExe = $candidate.FullName }
          }
          if (-not (Test-Path $appExe)) { throw "Installed Divan.exe was not found" }

          foreach ($attempt in 1..2) {
            $app = Start-Process -FilePath $appExe -PassThru
            Start-Sleep -Seconds 5
            if ($app.HasExited) {
              throw "Installed Divan.exe exited during restart acceptance attempt $attempt with code $($app.ExitCode)"
            }
            Stop-Process -Id $app.Id -Force
            Start-Sleep -Seconds 1
          }

      - name: Run source-bound cross-agent acceptance
        shell: pwsh
        run: |
          & scripts/windows_desktop_acceptance.ps1 -Output $env:DIVAN_ACCEPTANCE_EVIDENCE
          if ($LASTEXITCODE -ne 0) { throw "real-user Windows acceptance failed" }

      - name: Verify acceptance evidence contract
        shell: pwsh
        run: |
          $sourceCommit = (& git rev-parse HEAD).Trim()
          $sourceTree = (& git rev-parse 'HEAD^{tree}').Trim()
          python scripts/desktop_release_guard.py --acceptance-evidence $env:DIVAN_ACCEPTANCE_EVIDENCE --source-commit $sourceCommit --source-tree $sourceTree
          if ($LASTEXITCODE -ne 0) { throw "acceptance evidence contract failed" }

      - name: Attest real-user acceptance evidence
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: ${{ env.DIVAN_ACCEPTANCE_EVIDENCE }}

      - name: Upload attested acceptance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: divan-windows-acceptance
          path: ${{ env.DIVAN_ACCEPTANCE_EVIDENCE }}
          if-no-files-found: error
          retention-days: 30

      - name: Remove acceptance installation
        if: always()
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:LOCALAPPDATA "Divan"
          $uninstaller = Get-ChildItem $installRoot -Filter "uninstall*.exe" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($uninstaller) {
            $process = Start-Process -FilePath $uninstaller.FullName -ArgumentList "/S" -Wait -PassThru
            if ($process.ExitCode -ne 0) {
              Write-Warning "Divan acceptance cleanup returned exit code $($process.ExitCode)"
            }
          }
