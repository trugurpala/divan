name: pusula-dagger-python-bootstrap

on:
  pull_request:
    paths:
      - '.github/workflows/pusula-dagger-python-bootstrap.yml'

permissions:
  contents: read

jobs:
  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install exact Dagger stable CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dagger-bin"
          curl -fsSL https://dl.dagger.io/dagger/install.sh \
            | DAGGER_VERSION=0.21.8 BIN_DIR="$RUNNER_TEMP/dagger-bin" sh
          echo "$RUNNER_TEMP/dagger-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/dagger-bin/dagger" version

      - name: Scaffold Python pipeline
        shell: bash
        env:
          DAGGER_NO_NAG: '1'
        run: |
          set -euo pipefail
          rm -rf incubator/pusula/pipeline-python
          mkdir -p incubator/pusula/pipeline-python
          dagger -y init \
            --sdk=python \
            --name=pusula-pipeline \
            ./incubator/pusula/pipeline-python
          test -f incubator/pusula/pipeline-python/dagger.json
          find incubator/pusula/pipeline-python -maxdepth 4 -type f -print | sort

      - name: Package generated Python module
        shell: bash
        run: |
          set -euo pipefail
          tar -C incubator/pusula -czf "$RUNNER_TEMP/pusula-pipeline-python.tgz" pipeline-python
          sha256sum "$RUNNER_TEMP/pusula-pipeline-python.tgz"

      - name: Upload generated Python Dagger module
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pusula-dagger-python-generated
          path: ${{ runner.temp }}/pusula-pipeline-python.tgz
          if-no-files-found: error
          retention-days: 1
