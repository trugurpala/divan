name: Desktop Build

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "plugins/sadrazam/divan_runtime/**"
      - "scripts/divan-desktop-bridge.py"
      - "scripts/build_desktop_core.py"
      - "tests/test_desktop_protocol.py"
      - "tests/test_project_readiness.py"
      - "tests/test_project_registry.py"
      - "tests/test_native_engine.py"
      - "tests/test_orchestrator.py"
      - "tests/test_reviewer_runner.py"
      - ".github/workflows/desktop-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-windows:
    name: desktop-windows
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v1

      - name: Install sidecar packager
        run: python -m pip install --disable-pip-version-check pyinstaller

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --no-frozen-lockfile

      - name: Run desktop core tests
        run: >-
          python -m unittest
          tests.test_desktop_protocol
          tests.test_project_readiness
          tests.test_project_registry
          tests.test_native_engine
          tests.test_task_store
          tests.test_orchestrator
          tests.test_execution_router
          tests.test_review_gate
          tests.test_reviewer_runner
          tests.test_orca_engine
          tests.test_orca_adapter

      - name: Typecheck and build frontend
        working-directory: apps/desktop
        run: pnpm build

      - name: Build sidecar and NSIS installer
        working-directory: apps/desktop
        run: pnpm desktop:build

      - name: Upload Windows bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: divan-desktop-windows
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
