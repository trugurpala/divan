name: Desktop Build

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "plugins/sadrazam/divan_runtime/**"
      - "scripts/divan-desktop-bridge.py"
      - "scripts/build_desktop_core.py"
      - "scripts/desktop_release_guard.py"
      - "scripts/prepare_desktop_release_config.py"
      - "scripts/windows_desktop_acceptance.ps1"
      - "tests/test_desktop_protocol.py"
      - "tests/test_project_readiness.py"
      - "tests/test_project_registry.py"
      - "tests/test_executable_locator.py"
      - "tests/test_native_engine.py"
      - "tests/test_orchestrator.py"
      - "tests/test_reviewer_runner.py"
      - "tests/test_git_guard.py"
      - "tests/test_desktop_release_guard.py"
      - "tests/test_prepare_desktop_release_config.py"
      - "tests/test_desktop_release_workflow.py"
      - ".github/workflows/desktop-build.yml"
      - ".github/workflows/desktop-release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-windows:
    name: desktop-windows
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v1

      - name: Install sidecar packager
        run: python -m pip install --disable-pip-version-check pyinstaller

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --no-frozen-lockfile

      - name: Run desktop core tests
        run: >-
          python -m unittest
          tests.test_desktop_protocol
          tests.test_project_readiness
          tests.test_project_registry
          tests.test_executable_locator
          tests.test_native_engine
          tests.test_task_store
          tests.test_orchestrator
          tests.test_execution_router
          tests.test_review_gate
          tests.test_reviewer_runner
          tests.test_git_guard
          tests.test_desktop_release_guard
          tests.test_prepare_desktop_release_config
          tests.test_desktop_release_workflow
          tests.test_orca_engine
          tests.test_orca_adapter

      - name: Typecheck and build frontend
        working-directory: apps/desktop
        run: pnpm build

      - name: Build sidecar and NSIS installer
        working-directory: apps/desktop
        run: pnpm desktop:build

      - name: Smoke-test installed Windows bundle
        shell: pwsh
        run: |
          $installer = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "NSIS installer was not produced"
          }

          $install = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "NSIS silent install failed with exit code $($install.ExitCode)"
          }

          $appExe = Join-Path $env:LOCALAPPDATA "Divan/Divan.exe"
          if (-not (Test-Path $appExe)) {
            $candidate = Get-ChildItem $env:LOCALAPPDATA -Filter "Divan.exe" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($candidate) {
              $appExe = $candidate.FullName
            }
          }
          if (-not (Test-Path $appExe)) {
            throw "Installed Divan.exe was not found under LOCALAPPDATA"
          }

          $installRoot = Split-Path -Parent $appExe
          $core = Get-ChildItem $installRoot -Filter "divan-core*.exe" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $core) {
            throw "Installed Divan Core sidecar was not found"
          }

          $coreOutput = '{"command":"capabilities"}' | & $core.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Installed Divan Core sidecar failed with exit code $LASTEXITCODE"
          }
          $payload = $coreOutput | ConvertFrom-Json
          if (-not $payload.ok -or $payload.result.product -ne "Divan") {
            throw "Installed Divan Core sidecar returned an invalid capabilities response"
          }
          $expectedTree = (& git rev-parse 'HEAD^{tree}').Trim()
          $provenance = $payload.result.build_provenance
          if (-not $provenance -or $provenance.source_tree -ne $expectedTree) {
            throw "Installed Divan Core provenance does not match the checked-out source tree"
          }
          if ($provenance.source_commit -notmatch '^[0-9a-f]{40}$') {
            throw "Installed Divan Core source commit provenance is invalid"
          }

          $app = Start-Process -FilePath $appExe -PassThru
          Start-Sleep -Seconds 5
          if ($app.HasExited) {
            throw "Installed Divan.exe exited during launch smoke test with code $($app.ExitCode)"
          }
          Stop-Process -Id $app.Id -Force

      - name: Upload Windows bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: divan-desktop-windows
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
