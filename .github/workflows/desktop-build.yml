name: Desktop Build

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "plugins/sadrazam/divan_runtime/**"
      - "scripts/divan-desktop-bridge.py"
      - "scripts/build_desktop_core.py"
      - "tests/test_desktop_protocol.py"
      - "tests/test_project_readiness.py"
      - "tests/test_project_registry.py"
      - "tests/test_native_engine.py"
      - "tests/test_orchestrator.py"
      - ".github/workflows/desktop-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-windows:
    name: desktop-windows
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install sidecar packager
        run: python -m pip install --disable-pip-version-check pyinstaller

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --no-frozen-lockfile

      - name: Run desktop core tests
        run: >-
          python -m unittest
          tests.test_desktop_protocol
          tests.test_project_readiness
          tests.test_project_registry
          tests.test_native_engine
          tests.test_task_store
          tests.test_orchestrator
          tests.test_execution_router
          tests.test_review_gate
          tests.test_orca_engine
          tests.test_orca_adapter

      - name: Typecheck and build frontend
        working-directory: apps/desktop
        run: pnpm build

      - name: Build sidecar and NSIS installer
        working-directory: apps/desktop
        run: pnpm desktop:build

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: divan-desktop-windows
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
