name: Desktop Production Readiness

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact accepted main commit SHA approved for production readiness"
        required: true
        type: string

permissions: read-all

jobs:
  production-readiness:
    name: production-signing-readiness
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20
    environment: production-release
    permissions:
      attestations: write
      contents: read
      id-token: write
      artifact-metadata: write
    env:
      DIVAN_EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify requested production-readiness source identity
        shell: pwsh
        env:
          DIVAN_GITHUB_TOKEN: ${{ github.token }}
        run: |
          $expected = "$env:DIVAN_EXPECTED_SOURCE_SHA".Trim().ToLowerInvariant()
          $actual = (& git rev-parse HEAD).Trim().ToLowerInvariant()
          $eventSha = "$env:GITHUB_SHA".Trim().ToLowerInvariant()
          if ($expected -notmatch '^[0-9a-f]{40}$') {
            throw "source_sha must be an exact 40-character Git commit SHA"
          }
          if ($actual -ne $eventSha) {
            throw "Production readiness checkout does not match the workflow event source SHA"
          }
          if ($expected -ne $actual) {
            throw "Requested production readiness source SHA does not match the workflow source commit"
          }

          $headers = @{
            Authorization = "Bearer $env:DIVAN_GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $ref = Invoke-RestMethod `
            -Headers $headers `
            -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/git/ref/heads/main"
          $liveMain = "$($ref.object.sha)".Trim().ToLowerInvariant()
          if ($liveMain -notmatch '^[0-9a-f]{40}$') {
            throw "Current main source SHA could not be resolved"
          }
          if ($expected -ne $liveMain) {
            throw "main moved after production readiness dispatch; restart DSK-06 and DSK-07 on current main"
          }

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install Desktop dependencies from lockfile
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Verify dependency lockfile did not drift
        shell: pwsh
        run: |
          git diff --exit-code -- apps/desktop/pnpm-lock.yaml
          if ($LASTEXITCODE -ne 0) {
            throw "Desktop pnpm lockfile drifted during production readiness"
          }

      - name: Probe production signing and updater material
        shell: pwsh
        env:
          DIVAN_UPDATER_PUBKEY: ${{ secrets.DIVAN_UPDATER_PUBKEY }}
          DIVAN_UPDATER_ENDPOINT: ${{ secrets.DIVAN_UPDATER_ENDPOINT }}
          DIVAN_UPDATER_ARTIFACT_BASE_URL: ${{ secrets.DIVAN_UPDATER_ARTIFACT_BASE_URL }}
          DIVAN_WINDOWS_SIGN_COMMAND: ${{ secrets.DIVAN_WINDOWS_SIGN_COMMAND }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP "divan-production-readiness.json"
          & scripts/windows_desktop_production_readiness.ps1 -Output $evidence
          if ($LASTEXITCODE -ne 0) { throw "production readiness probe failed" }
          if (-not (Test-Path $evidence -PathType Leaf)) { throw "production readiness evidence was not produced" }

          $payload = Get-Content $evidence -Raw | ConvertFrom-Json
          $sourceCommit = (& git rev-parse HEAD).Trim().ToLowerInvariant()
          $sourceTree = (& git rev-parse 'HEAD^{tree}').Trim().ToLowerInvariant()
          if ($payload.status -ne "pass") { throw "production readiness evidence did not pass" }
          if ($payload.source_commit -ne $sourceCommit -or $payload.source_tree -ne $sourceTree) {
            throw "production readiness evidence is not bound to exact source identity"
          }
          foreach ($field in @(
            "release_overlay_valid",
            "updater_public_key_configured",
            "updater_endpoint_https",
            "artifact_base_exact_release_tag",
            "authenticode_sign_command_usable",
            "authenticode_signature_valid",
            "tauri_private_key_sign_probe"
          )) {
            if ($payload.$field -ne $true) { throw "production readiness evidence missing required PASS: $field" }
          }
          if ($payload.private_signing_material_persisted -ne $false -or $payload.secret_values_in_evidence -ne $false) {
            throw "production readiness evidence violated secret-minimization policy"
          }
          "DIVAN_PRODUCTION_READINESS_EVIDENCE=$evidence" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Attest production readiness evidence
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: ${{ env.DIVAN_PRODUCTION_READINESS_EVIDENCE }}

      - name: Upload production readiness evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: divan-production-readiness
          path: ${{ env.DIVAN_PRODUCTION_READINESS_EVIDENCE }}
          if-no-files-found: error
          retention-days: 30
